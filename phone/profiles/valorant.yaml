# phone/profiles/valorant.yaml — 瓦罗兰特 HUD 字段
#
# 与 phone/fields.yaml 的区别：这份是 FPS HUD，读血量/护甲/弹药/经济/计时。
# 用法：python phone/pc_capture.py --profile valorant
#
# 所有矩形都是「游戏画面」的归一化坐标（0..1，原点左上角）。
# 下面这组数值是在真实对局画面上用全图 OCR 定位出来的（1920x1080 的购买阶段与
# 交战阶段各一张），不是估的：
#
#   hp          100   x[577,654]   y[1005,1049]  血量（左下大数字）
#   shield      100   x[946,979]   y[977,996]    护甲（技能栏上方小数字）
#   ammo        12    x[1280,1333] y[1008,1047]  弹匣（分隔符是弹匣图标，不是斜杠）
#   ammoReserve 36    x[1355,1390] y[1015,1043]  备弹
#   credits     800   x[1816,1869] y[1036,1057]  经济
#   timer       0:10  x[926,996]   y[27,72]      回合计时
#   allyKills   0     x[818,828]   y[34,56]      顶部分数（低对比度，需要 enhance）
#   enemyKills  0     x[1095,1107] y[34,56]
#
# 换分辨率不用改：坐标是归一化的。换了宽高比（比如 21:9）就得重新校准。

version: 1
profile: valorant
name: 瓦罗兰特
calibrated: true
basis: { width: 1920, height: 1080 }

ocr:
  every_ms: 400      # FPS 血量变化快，采样比 LoL 密一点
  stale_ms: 1200
  min_score: 0.30
  threads: 3

fields:
  hp:
    rect: [0.2960, 0.9250, 0.0480, 0.0520]
    kind: int
    min: 0
    max: 150
    purpose: 当前生命值
  shield:
    # 实测（2560x1440 实战帧 full-150033/150234）：护甲「50」在血量的**左边**
    # x=0.2824,y=0.9403，不是中间技能栏上方。旧配置写成 0.4880，完全错位。
    rect: [0.2780, 0.9330, 0.0220, 0.0290]
    kind: int
    min: 0
    max: 100
    purpose: 护甲值（紧挨血量左边，只在有护甲时显示）
  ammo:
    rect: [0.6560, 0.9250, 0.0420, 0.0480]
    kind: int
    min: 0
    max: 999
    purpose: 弹匣子弹数
  ammoReserve:
    rect: [0.7030, 0.9290, 0.0350, 0.0400]
    kind: int
    min: 0
    max: 999
    purpose: 备弹数
  credits:
    rect: [0.9410, 0.9550, 0.0330, 0.0260]
    kind: int
    min: 0
    max: 9000
    purpose: 经济
  timer:
    rect: [0.4780, 0.0220, 0.0430, 0.0480]
    kind: clock
    looseClock: true
    purpose: 回合计时
  score:
    derive: [allyKills, enemyKills]

  allyKills:
    rect: [0.4219, 0.0260, 0.0146, 0.0315]
    kind: int
    min: 0
    max: 20
    enhance: bright
    enhancePct: 92
    min_score: 0.38
    purpose: 我方回合分
  enemyKills:
    rect: [0.5660, 0.0280, 0.0140, 0.0300]
    kind: int
    min: 0
    max: 20
    purpose: 敌方回合分
