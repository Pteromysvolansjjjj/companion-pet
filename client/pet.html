<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>陪玩桌宠</title>
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22%E9%99%AA%E7%8E%A9%E6%A1%8C%E5%AE%A0%22%2C%22short_name%22%3A%22%E6%A1%8C%E5%AE%A0%22%2C%22display%22%3A%22fullscreen%22%2C%22background_color%22%3A%22%230b1220%22%2C%22theme_color%22%3A%22%230b1220%22%2C%22start_url%22%3A%22.%22%7D">
<style>
  :root {
    --bg-0: #080d18;
    --bg-1: #101a30;
    --glow: #6f8dff;
    --bubble: rgba(248, 250, 255, 0.94);
    --ink: #17203a;
    --muted: rgba(214, 226, 255, 0.62);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: radial-gradient(120% 90% at 50% 8%, var(--bg-1) 0%, var(--bg-0) 62%);
    color: #e9f0ff;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    user-select: none;
    overscroll-behavior: none;
  }
  #app {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    padding: calc(12px + env(safe-area-inset-top)) 16px calc(10px + env(safe-area-inset-bottom));
  }
  header {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--muted); letter-spacing: .02em;
    min-height: 20px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #ff6b6b; box-shadow: 0 0 8px rgba(255, 107, 107, .7);
    transition: background .3s, box-shadow .3s;
  }
  .dot.online { background: #58e08c; box-shadow: 0 0 10px rgba(88, 224, 140, .8); }
  #status { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #meta { font-variant-numeric: tabular-nums; opacity: .8; }

  main {
    flex: 1; display: flex; flex-direction: column;
    justify-content: flex-end; align-items: center;
    position: relative; min-height: 0;
  }
  #bubbleWrap {
    position: relative; width: 100%; max-width: 460px;
    display: flex; justify-content: center;
    margin-bottom: 10px; pointer-events: none;
    opacity: 0; transform: translateY(8px);
    transition: opacity .28s ease, transform .28s ease;
  }
  #bubbleWrap.show { opacity: 1; transform: translateY(0); }
  #bubble {
    position: relative;
    background: var(--bubble);
    color: var(--ink);
    padding: 14px 18px;
    border-radius: 20px;
    font-size: clamp(17px, 4.6vw, 22px);
    line-height: 1.55;
    max-width: 100%;
    word-break: break-word;
    box-shadow: 0 12px 34px rgba(0, 0, 0, .38), 0 2px 0 rgba(255,255,255,.5) inset;
    min-height: 52px;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
  }
  #bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -8px;
    width: 16px; height: 16px; background: var(--bubble);
    transform: translateX(-50%) rotate(45deg);
    border-radius: 3px;
  }
  #petWrap {
    position: relative; display: flex; justify-content: center; align-items: flex-end;
    width: 100%; pointer-events: auto;
  }
  #pet {
    height: min(46vh, 420px); width: auto; max-width: 92vw;
    filter: drop-shadow(0 18px 26px rgba(0, 0, 0, .45));
    animation: float 4.2s ease-in-out infinite;
    transform-origin: 50% 88%;
    transition: transform .12s ease;
  }
  #pet:active { transform: scale(.985); }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }
  #hint {
    position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
    font-size: 11px; color: rgba(200, 214, 255, .35); white-space: nowrap;
  }
  #offline {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center; flex-direction: column; gap: 10px;
    background: rgba(8, 13, 24, .92); text-align: center; padding: 24px;
    font-size: 14px; color: #cfd9ff;
  }
  #offline.show { display: flex; }
  #offline code { font-size: 12px; color: #8ea6ff; word-break: break-all; }

  @media (orientation: landscape) and (max-height: 560px) {
    #app { padding: calc(8px + env(safe-area-inset-top)) 20px calc(8px + env(safe-area-inset-bottom)); }
    main { flex-direction: row; justify-content: center; align-items: center; gap: 24px; }
    #bubbleWrap { max-width: 46vw; margin: 0; }
    #pet { height: min(72vh, 320px); }
    #bubble::after { left: -6px; top: 50%; bottom: auto; transform: translateY(-50%) rotate(45deg); }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="dot" id="dot"></span>
    <span id="status">正在连接…</span>
    <span id="meta"></span>
  </header>
  <main>
    <div id="bubbleWrap"><div id="bubble"></div></div>
    <div id="petWrap">
      <img id="pet" src="./assets/pet-mobile.png" alt="桌宠" draggable="false">
      <div id="hint">轻点角色翻页</div>
    </div>
  </main>
</div>
<div id="offline">
  <div>与电脑的连接已断开</div>
  <code id="offlineUrl"></code>
  <div style="font-size:12px;color:#8ea6ff">确认电脑上的陪玩仍在监听，且手机与电脑在同一 Wi-Fi</div>
</div>

<script>
(() => {
  const token = new URLSearchParams(location.search).get('t') || '';
  document.getElementById('offlineUrl').textContent = location.href;
  const dot = document.getElementById('dot');
  const statusEl = document.getElementById('status');
  const metaEl = document.getElementById('meta');
  const bubble = document.getElementById('bubble');
  const wrap = document.getElementById('bubbleWrap');
  const offline = document.getElementById('offline');
  const pet = document.getElementById('pet');

  let pages = [];
  let holdMs = 5000;
  let typing = null;
  let advanceTimer = null;
  let statusTimer = null;
  let source = null;
  let wakeLock = null;

  function setOnline(on) {
    dot.classList.toggle('online', on);
    offline.classList.toggle('show', !on);
  }

  function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

  function stopPlayback() {
    if (typing) { clearInterval(typing); typing = null; }
    if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; }
  }

  async function typeText(text) {
    bubble.textContent = '';
    wrap.classList.add('show');
    stopPlayback();
    await new Promise(resolve => {
      let index = 0;
      typing = setInterval(() => {
        index += 1;
        bubble.textContent = text.slice(0, index);
        if (index >= text.length) { clearInterval(typing); typing = null; resolve(); }
      }, 26);
    });
  }

  async function playQueue() {
    if (!pages.length) return;
    const text = pages[0];
    await typeText(text);
    holdMs = Math.max(1200, Math.min(30000, holdMs));
    advanceTimer = setTimeout(() => {
      advanceTimer = null;
      pages.shift();
      if (pages.length) playQueue();
      else wrap.classList.remove('show');
    }, holdMs);
  }

  function onReply(message) {
    const lines = Array.isArray(message.lines) ? message.lines.filter(line => typeof line === 'string' && line.trim()) : [];
    if (!lines.length) { wrap.classList.remove('show'); return; }
    pages = lines.slice();
    holdMs = Number(message.holdMs) || 5000;
    playQueue();
  }

  function onStatus(message) {
    if (typeof message.text !== 'string') return;
    statusEl.textContent = message.text;
    if (statusTimer) clearTimeout(statusTimer);
    statusTimer = setTimeout(() => { statusEl.textContent = '已连接'; }, 5000);
  }

  function onState(message) {
    const data = message.data || {};
    const bits = [];
    if (data.dataSource) bits.push(data.dataSource === 'api' ? '接口' : '屏幕');
    if (data.watching) bits.push('监听中');
    if (Number.isFinite(data.events)) bits.push(data.events + ' 事件');
    metaEl.textContent = bits.join(' · ');
  }

  function handle(message) {
    switch (message.type) {
      case 'reply': onReply(message); break;
      case 'status': onStatus(message); break;
      case 'clear': stopPlayback(); pages = []; wrap.classList.remove('show'); break;
      case 'state': onState(message); break;
      case 'preferences': onState({ data: { dataSource: message.values && message.values.dataSource, watching: true } }); break;
      default: break;
    }
  }

  function connect() {
    if (source) source.close();
    source = new EventSource('./events?t=' + encodeURIComponent(token));
    source.onopen = () => { setOnline(true); statusEl.textContent = '已连接'; };
    source.onerror = () => { setOnline(false); statusEl.textContent = '连接中断，重试中…'; };
    source.onmessage = event => {
      try { handle(JSON.parse(event.data)); } catch { /* ignore malformed */ }
    };
  }

  async function keepAwake() {
    try {
      if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
    } catch { /* the phone may still sleep; the user can extend the timeout */ }
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      if (!source || source.readyState === EventSource.CLOSED) connect();
      keepAwake();
    }
  });

  pet.addEventListener('click', () => {
    if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; }
    if (!typing && pages.length) {
      pages.shift();
      if (pages.length) playQueue();
      else wrap.classList.remove('show');
    }
  });

  // WebView 宿主（Android APK）通过这两个函数推内容，不依赖 SSE 也能用。
  window.petSay = function (lines, hold) {
    onReply({ lines: lines, holdMs: hold });
    setOnline(true);
  };

  window.petStatus = function (text) {
    onStatus({ text: text });
    setOnline(!/断开|重试|失败/.test(String(text || '')));
  };

  if (!token) {
    statusEl.textContent = '等待连接';
    setOnline(false);
  } else {
    keepAwake();
    connect();
  }
})();
</script>
</body>
</html>
